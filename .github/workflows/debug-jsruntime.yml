name: Debug jsruntime on Linux (temporary)

# 临时诊断工作流：仅用于定位 pkg/jsruntime 在 Linux 上的测试失败根因。
# 只读、无 secrets、不发布任何东西。定位完成后会在后续提交中删除。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: fs mode parsing probe (raw evidence)
        run: |
          set -euxo pipefail
          cat > pkg/jsruntime/zz_debug_fs_test.go <<'EOF'
          package jsruntime

          import (
          	"fmt"
          	"io"
          	"os"
          	"path/filepath"
          	"testing"
          	"time"
          )

          // TestZZDebugFSProbe reports the on-disk mode of files created by the
          // JS fs layer for the different argument shapes Node allows.
          func TestZZDebugFSProbe(t *testing.T) {
          	base := t.TempDir()
          	rt, err := New(`
          		const fs = require("fs");
          		const path = require("path");
          		function oct(mode) { return "0o" + (mode & 0o7777).toString(8); }
          		function modeOf(p) { try { return oct(fs.statSync(p).mode); } catch (e) { return "ERR " + e.code; } }
          		function probe(label, fn) {
          			try { fn(); return label + " => OK"; }
          			catch (e) {
          				return label + " => ERR code=" + e.code + " errno=" + e.errno +
          					" syscall=" + e.syscall + " path=" + e.path;
          			}
          		}
          		function run() {
          			const out = [];
          			out.push(probe("A writeFileSync(p,d,'utf8')", () => fs.writeFileSync("a.txt", "x", "utf8")));
          			out.push("A mode=" + modeOf("a.txt"));
          			out.push(probe("A readback", () => fs.readFileSync("a.txt", "utf8")));
          			out.push(probe("B writeFileSync(p,d)", () => fs.writeFileSync("b.txt", "x")));
          			out.push("B mode=" + modeOf("b.txt"));
          			out.push(probe("B readback", () => fs.readFileSync("b.txt", "utf8")));
          			out.push(probe("C writeFileSync(p,d,{mode:0o644})", () => fs.writeFileSync("c.txt", "x", { mode: 0o644 })));
          			out.push("C mode=" + modeOf("c.txt"));
          			out.push(probe("D appendFileSync(p,d,'utf8')", () => fs.appendFileSync("d.txt", "x", "utf8")));
          			out.push("D mode=" + modeOf("d.txt"));
          			out.push(probe("E openSync(p,'w','utf8')", () => { const fd = fs.openSync("e.txt", "w", "utf8"); fs.closeSync(fd); }));
          			out.push("E mode=" + modeOf("e.txt"));
          			out.push(probe("F mkdirSync('dir1')", () => fs.mkdirSync("dir1")));
          			out.push("F mode=" + modeOf("dir1"));
          			out.push(probe("G mkdirSync('dir2',{recursive:true})", () => fs.mkdirSync("dir2", { recursive: true })));
          			out.push("G mode=" + modeOf("dir2"));
          			out.push(probe("H mkdirSync('dir3','0755')", () => fs.mkdirSync("dir3", "0755")));
          			out.push("H mode=" + modeOf("dir3"));
          			out.push(probe("I write-in-dir1", () => fs.writeFileSync("dir1/x.txt", "x")));
          			out.push(probe("I readback-dir1", () => fs.readFileSync("dir1/x.txt", "utf8")));
          			throw new Error("\n" + out.join("\n"));
          		}
          	`, Options{NodeJS: true, BaseDir: base, Console: io.Discard, Timeout: 10 * time.Second})
          	if err != nil {
          		t.Fatalf("runtime init: %v", err)
          	}
          	defer rt.Close()
          	if err := rt.Call("run"); err != nil {
          		t.Logf("PROBE REPORT:\n%v", err)
          	}
          	for _, name := range []string{"a.txt", "b.txt", "c.txt", "d.txt", "e.txt", "dir1", "dir2", "dir3"} {
          		info, statErr := os.Stat(filepath.Join(base, name))
          		if statErr != nil {
          			fmt.Printf("GO-STAT %s: %v\n", name, statErr)
          			continue
          		}
          		fmt.Printf("GO-STAT %s: mode=%v perm=%#o\n", name, info.Mode(), info.Mode().Perm())
          	}
          }
          EOF
          go test ./pkg/jsruntime/ -run TestZZDebugFSProbe -v -count=1 2>&1 | tail -60

      - name: async fs API probe (fs.promises / callback paths)
        run: |
          set -euxo pipefail
          cat > pkg/jsruntime/zz_debug_async_test.go <<'EOF'
          package jsruntime

          import (
          	"fmt"
          	"io"
          	"os"
          	"path/filepath"
          	"testing"
          	"time"
          )

          func TestZZDebugAsyncProbe(t *testing.T) {
          	base := t.TempDir()
          	rt, err := New(`
          		const fs = require("fs");
          		function oct(mode) { return "0o" + (mode & 0o7777).toString(8); }
          		async function verify() {
          			const out = [];
          			out.push("cwd=" + process.cwd());
          			await fs.promises.writeFile("p1.txt", "x", "utf8");
          			out.push("promises.writeFile(p,d,'utf8') mode=" + oct(fs.statSync("p1.txt").mode));
          			try { out.push("readback1=" + await fs.promises.readFile("p1.txt", "utf8")); }
          			catch (e) { out.push("readback1 ERR code=" + e.code + " path=" + e.path); }
          			await fs.promises.writeFile("p2.txt", "x");
          			out.push("promises.writeFile(p,d) mode=" + oct(fs.statSync("p2.txt").mode));
          			try { out.push("readback2=" + await fs.promises.readFile("p2.txt", "utf8")); }
          			catch (e) { out.push("readback2 ERR code=" + e.code); }
          			await new Promise((resolve, reject) => fs.writeFile("p3.txt", "x", "utf8", (e) => e ? reject(e) : resolve()));
          			out.push("callback writeFile mode=" + oct(fs.statSync("p3.txt").mode));
          			return out.join("\n");
          		}
          	`, Options{NodeJS: true, BaseDir: base, Console: io.Discard, Timeout: 10 * time.Second})
          	if err != nil {
          		t.Fatalf("runtime init: %v", err)
          	}
          	defer rt.Close()
          	if err := rt.Call("verify"); err != nil {
          		fmt.Printf("ASYNC PROBE ERR: %v\n", err)
          	}
          	for _, name := range []string{"p1.txt", "p2.txt", "p3.txt"} {
          		info, statErr := os.Stat(filepath.Join(base, name))
          		if statErr != nil {
          			fmt.Printf("GO-STAT %s: %v\n", name, statErr)
          			continue
          		}
          		fmt.Printf("GO-STAT %s: perm=%#o\n", name, info.Mode().Perm())
          	}
          }
          EOF
          go test ./pkg/jsruntime/ -run TestZZDebugAsyncProbe -v -count=1 2>&1 | tail -40

      - name: child_process probe (which sub-condition fails)
        run: |
          set -euxo pipefail
          cat > pkg/jsruntime/zz_debug_child_test.go <<'EOF'
          package jsruntime

          import (
          	"fmt"
          	"io"
          	"testing"
          	"time"
          )

          func TestZZDebugChildProbe(t *testing.T) {
          	rt, err := New(`
          		function verify(command) {
          			const childProcess = require("child_process");
          			const report = { command: command, steps: [] };
          			let syncOutput = null, syncError = null;
          			try { syncOutput = childProcess.execSync(command, { encoding: "utf8" }); }
          			catch (e) { syncError = String(e); }
          			report.syncOutput = JSON.stringify(syncOutput);
          			report.syncTrimmed = JSON.stringify(syncOutput === null ? null : syncOutput.trim());
          			report.syncError = syncError;
          			return new Promise((resolve) => {
          				try {
          					const child = childProcess.spawn(command, [], { shell: true, encoding: "utf8" });
          					report.pid = child.pid;
          					report.hasStdout = !!child.stdout;
          					if (!child.stdout) { resolve(JSON.stringify(report)); return; }
          					let output = "";
          					child.stdout.on("data", (chunk) => { output += String(chunk); });
          					child.on("close", (code) => {
          						report.exitCode = code;
          						report.output = JSON.stringify(output);
          						report.outputTrimmed = JSON.stringify(output.trim());
          						resolve(JSON.stringify(report));
          					});
          					child.on("error", (e) => { report.spawnError = String(e); resolve(JSON.stringify(report)); });
          				} catch (e) {
          					report.thrown = String(e);
          					resolve(JSON.stringify(report));
          				}
          			});
          		}
          	`, Options{NodeJS: true, AllowExec: true, BaseDir: t.TempDir(), Console: io.Discard, Timeout: 10 * time.Second})
          	if err != nil {
          		t.Fatalf("runtime init: %v", err)
          	}
          	defer rt.Close()
          	if err := rt.Call("verify", "printf child"); err != nil {
          		fmt.Printf("CHILD PROBE: Call returned error: %v\n", err)
          	}
          }
          EOF
          go test ./pkg/jsruntime/ -run TestZZDebugChildProbe -v -count=1 2>&1 | tail -40

      - name: The three failing tests, verbose
        run: |
          go test ./pkg/jsruntime/ -count=1 -v \
            -run 'TestNodeCoreModulesAndECMAScriptBuiltins|TestStorageDirIsConfinedAdditionalRoot|TestChildProcessPermissionAndExecution' \
            2>&1 | tail -30
