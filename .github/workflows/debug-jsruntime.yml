name: Debug jsruntime on Linux (temporary)

# 临时诊断工作流：仅用于定位 pkg/jsruntime 在 Linux 上的测试失败根因。
# 只读、无 secrets、不发布任何东西。定位完成后会在后续提交中删除。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Environment facts
        run: |
          set -x
          id
          umask
          uname -a
          echo "TMPDIR=${TMPDIR:-<unset>}"
          ls -ld /tmp
          readlink -f /tmp
          stat -c '%a %U:%G %n' /tmp
          mount | grep -E ' on / | on /tmp ' | head -5
          df -T /tmp | head -3

      - name: Plain os.Root probe (isolates Go API from jsruntime logic)
        run: |
          set -euxo pipefail
          mkdir -p /tmp/rootprobe && cd /tmp/rootprobe
          go mod init rootprobe >/dev/null 2>&1
          cat > main.go <<'EOF'
          package main

          import (
          	"fmt"
          	"os"
          	"path/filepath"
          )

          func main() {
          	base, err := os.MkdirTemp("", "probe")
          	if err != nil {
          		fmt.Println("MkdirTemp:", err)
          		return
          	}
          	fmt.Printf("temp=%s\n", base)
          	if fi, err := os.Stat(base); err == nil {
          		fmt.Printf("temp mode=%v\n", fi.Mode())
          	}

          	r, err := os.OpenRoot(base)
          	if err != nil {
          		fmt.Println("OpenRoot:", err)
          		return
          	}
          	defer r.Close()

          	if err := r.MkdirAll("data", 0o777); err != nil {
          		fmt.Println("root.MkdirAll(data,0777):", err)
          	} else {
          		fmt.Println("root.MkdirAll(data,0777): OK")
          	}

          	f, err := r.OpenFile(filepath.Join("data", "f.txt"), os.O_CREATE|os.O_WRONLY|os.O_TRUNC, 0o644)
          	if err != nil {
          		fmt.Println("root.OpenFile(create):", err)
          	} else {
          		_, werr := f.WriteString("x")
          		fmt.Println("root.OpenFile(create): OK, write err =", werr)
          		f.Close()
          	}

          	if fi, err := r.Stat("data"); err == nil {
          		fmt.Printf("root.Stat(data): mode=%v\n", fi.Mode())
          	} else {
          		fmt.Println("root.Stat(data):", err)
          	}
          	if fi, err := os.Stat(filepath.Join(base, "data")); err == nil {
          		fmt.Printf("os.Stat(data): mode=%v\n", fi.Mode())
          	} else {
          		fmt.Println("os.Stat(data):", err)
          	}
          	if err := os.WriteFile(filepath.Join(base, "raw.txt"), []byte("x"), 0o600); err != nil {
          		fmt.Println("os.WriteFile(raw, no root):", err)
          	} else {
          		fmt.Println("os.WriteFile(raw, no root): OK")
          	}
          	if err := r.RemoveAll("data"); err != nil {
          		fmt.Println("root.RemoveAll(data):", err)
          	} else {
          		fmt.Println("root.RemoveAll(data): OK")
          	}
          }
          EOF
          go run .

      - name: jsruntime-level probe (raw errno, created at runtime, not committed)
        run: |
          set -euxo pipefail
          cat > pkg/jsruntime/zz_debug_probe_test.go <<'EOF'
          package jsruntime

          import (
          	"fmt"
          	"io"
          	"os"
          	"testing"
          	"time"
          )

          func TestZZDebugProbe(t *testing.T) {
          	fmt.Printf("euid=%d egid=%d umask=?\n", os.Geteuid(), os.Getegid())
          	base := t.TempDir()
          	if fi, err := os.Stat(base); err == nil {
          		fmt.Printf("tempdir=%s mode=%v\n", base, fi.Mode())
          	}

          	rt, err := New(`
          		const fs = require("fs");
          		const path = require("path");
          		function probe(label, fn) {
          			try { fn(); return label + ": OK"; }
          			catch (e) {
          				return label + ": ERR code=" + e.code + " errno=" + e.errno + " syscall=" + e.syscall +
          					" path=" + e.path + " msg=" + String(e.message);
          			}
          		}
          		function run() {
          			const out = [];
          			out.push("cwd=" + process.cwd());
          			out.push(probe("write-file-rel", () => fs.writeFileSync("p1.txt", "x")));
          			out.push(probe("mkdir-data", () => fs.mkdirSync("data", { recursive: true })));
          			out.push(probe("mkdir-data-777", () => fs.mkdirSync("data777", { recursive: true, mode: 0o777 })));
          			out.push(probe("write-in-data", () => fs.writeFileSync("data/p2.txt", "x")));
          			out.push(probe("write-in-data777", () => fs.writeFileSync("data777/p3.txt", "x")));
          			out.push(probe("open-w-dir", () => { const fd = fs.openSync("data/p4.txt", "w"); fs.closeSync(fd); }));
          			out.push(probe("write-abs", () => fs.writeFileSync(path.join(process.cwd(), "p5.txt"), "x")));
          			out.push(probe("stat-cwd", () => { if (!fs.statSync(".").isDirectory()) throw new Error("not dir"); }));
          			out.push(probe("readdir-data", () => fs.readdirSync("data")));
          			return out.join("\n");
          		}
          	`, Options{NodeJS: true, BaseDir: base, Console: io.Discard, Timeout: 5 * time.Second})
          	if err != nil {
          		t.Fatalf("runtime init: %v", err)
          	}
          	defer rt.Close()
          	if err := rt.Call("run"); err != nil {
          		t.Fatalf("probe run: %v", err)
          	}
          }
          EOF
          go test ./pkg/jsruntime/ -run TestZZDebugProbe -v -count=1 2>&1 | tail -40

      - name: The three failing tests, verbose
        run: |
          go test ./pkg/jsruntime/ -count=1 -v \
            -run 'TestNodeCoreModulesAndECMAScriptBuiltins|TestStorageDirIsConfinedAdditionalRoot|TestChildProcessPermissionAndExecution' \
            2>&1 | tail -60
