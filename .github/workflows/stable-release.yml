name: Komari Stable Release

# 发布流程：release published 时构建各平台二进制并上传 release 资产，
# 随后构建并推送多架构 Docker 镜像。
#   - 浮动 tag:  stable            （仅当该 release 是最新正式版时更新）
#   - 不可变 tag: <release tag>    （例如 1.5.0-stable.1，永不覆盖）
# 与上游 release.yml 的区别：
#   1) 前端 ref 来自固定仓库 + 固定 ref（不解析 -fixN 后缀，不做默认分支回退）；
#   2) Go 版本显式固定；
#   3) 汇总生成 SHA256SUMS 并上传到 release；
#   4) 上传前按不可变规则校验（缺失才补、一致才跳过、不一致即失败）。
#
# 不可变性（由 scripts/release-guard.sh 强制，见 MAINTENANCE_POLICY.md §2.2）：
#   * 已发布的 release 资产永不覆盖：同名资产只有字节完全一致时才视为完成并跳过，
#     字节不同则立即 FAIL（immutable release asset mismatch），也不会删除旧资产绕过；
#   * 已发布的固定版本镜像 tag 永不指向新 digest：tag 已存在即 FAIL（stable 浮动 tag 仍可更新）；
#   * workflow_dispatch 只能"补齐缺失资产"——它不具备覆盖重发的能力。
#     若已公开的产物确实有问题，请发布 v1.5.0-stable.2，而不是重写 stable.1。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag；手动执行只能补齐缺失资产（已发布资产仅在字节一致时跳过，绝不覆盖）"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 构建期资产（嵌入前端 + 随包主题）由 bundled-themes.lock.json 固定，见 scripts/prepare-assets.py。
  ASSETS_ARTIFACT: komari-assets
  GO_VERSION: "1.25.x"
  ZIG_VERSION: "0.14.1"
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/prepare-assets
        with:
          artifact-name: komari-assets

  build-and-attach-binaries:
    needs: prepare-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            zig_target: x86_64-linux-musl
            ext: ""
          - goos: linux
            goarch: arm64
            zig_target: aarch64-linux-musl
            ext: ""
          - goos: windows
            goarch: amd64
            zig_target: x86_64-windows-gnu
            ext: ".exe"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/restore-assets
        with:
          artifact-name: komari-assets
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: ./.github/actions/setup-zig
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Resolve the version string (release tag without the v prefix)
        run: |
          # tag 用 v1.5.0-stable.0，二进制内显示的版本必须是 1.5.0-stable.0
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.zig_target }}
          GIN_MODE: release
        run: |
          set -euxo pipefail
          NAME="komari-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari/utils.VersionHash=${GITHUB_SHA}" \
            -o "$NAME" .
          ls -la "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: komari-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komari-${{ matrix.goos }}-${{ matrix.goarch }}*
      - name: "Upload binary to release (immutable - fill gaps only, never overwrite)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          NAME="komari-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          PLAN="${RUNNER_TEMP}/assets-to-upload.txt"
          # 已存在且字节一致 -> 计划里没有它，视为已完成；字节不同 -> guard 直接失败。
          bash scripts/release-guard.sh assets "${{ github.repository }}" "${RELEASE_TAG}" "$PLAN" "$NAME"
          if grep -qx "$NAME" "$PLAN"; then
            # 绝不使用 --clobber：只有目录里确实没有这个资产时才上传。
            gh release upload "${RELEASE_TAG}" "$NAME" --repo "${{ github.repository }}"
          else
            echo "SKIP: ${NAME} is already published with identical bytes"
          fi

  checksums:
    needs: build-and-attach-binaries
    runs-on: ubuntu-latest
    steps:
      # 需要仓库内容：上传前用 scripts/release-guard.sh 校验（保持不可变语义）。
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: komari-*
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          set -euxo pipefail
          cd dist
          rm -f SHA256SUMS
          sha256sum komari-* > SHA256SUMS
          cat SHA256SUMS
      - name: "Upload SHA256SUMS to release (immutable - fill gaps only, never overwrite)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          PLAN="${RUNNER_TEMP}/assets-to-upload.txt"
          bash scripts/release-guard.sh assets "${{ github.repository }}" "${RELEASE_TAG}" "$PLAN" dist/SHA256SUMS
          if grep -qx "SHA256SUMS" "$PLAN"; then
            gh release upload "${RELEASE_TAG}" dist/SHA256SUMS --repo "${{ github.repository }}"
          else
            echo "SKIP: SHA256SUMS is already published with identical bytes"
          fi

  build-and-push-docker:
    needs: build-and-attach-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: komari-linux-*
          path: .
          merge-multiple: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          # 该 release 是否为最新正式版：是则同时更新浮动 tag "stable"
          is_latest="$(gh api graphql \
            -f 'query=query($owner: String!, $name: String!, $tag: String!) { repository(owner: $owner, name: $name) { release(tagName: $tag) { isLatest } } }' \
            -F owner="${{ github.repository_owner }}" \
            -F name="${{ github.event.repository.name }}" \
            -F tag="${RELEASE_TAG}" \
            --jq '.data.repository.release.isLatest')"
          TAGS="${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}"
          if [ "$is_latest" = "true" ]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:stable"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite a published version tag
        run: |
          set -euxo pipefail
          # 固定版本 tag 一经成功发布即不可覆盖：已存在 -> FAIL；stable 浮动 tag 仍可更新。
          bash scripts/release-guard.sh image \
            "${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}" \
            "${REGISTRY}/${IMAGE_NAME}:stable"
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
