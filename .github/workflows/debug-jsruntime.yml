name: Debug jsruntime on Linux (temporary)

# 临时诊断工作流：仅用于定位 pkg/jsruntime 在 Linux 上的测试失败根因。
# 只读、无 secrets、不发布任何东西。定位完成后会在后续提交中删除。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Measure the child_process flake (repeat the real test)
        run: |
          set -x
          go test ./pkg/jsruntime/ -run 'TestChildProcessPermissionAndExecution' -count=200 2>&1 | tail -5
          echo "---- 失败计数 ----"
          go test ./pkg/jsruntime/ -run 'TestChildProcessPermissionAndExecution' -count=200 -v 2>&1 | grep -c -- "--- FAIL" || true

      - name: Capture the ordering of data vs close
        run: |
          set -euxo pipefail
          cat > pkg/jsruntime/zzz_flake_probe_test.go <<'EOF'
          package jsruntime

          import (
          	"fmt"
          	"io"
          	"testing"
          	"time"
          )

          const flakeScript = `
          	function verify(command, delayMs) {
          		const childProcess = require("child_process");
          		const syncOutput = childProcess.execSync(command, { encoding: "utf8" }).trim();
          		return new Promise((resolve, reject) => {
          			const child = childProcess.spawn(command, [], { shell: true, encoding: "utf8" });
          			let output = "";
          			let dataEvents = 0;
          			child.stdout.on("data", (chunk) => { dataEvents++; output += String(chunk); });
          			child.on("close", (code) => {
          				const verdictAtClose = (code === 0 && syncOutput === "child" && output.trim() === "child");
          				const snapshot = { atClose: output, dataAtClose: dataEvents, exitCode: code };
          				setTimeout(() => {
          					snapshot.afterWait = output;
          					snapshot.dataAfterWait = dataEvents;
          					snapshot.verdictAtClose = verdictAtClose;
          					snapshot.verdictAfterWait = (code === 0 && syncOutput === "child" && output.trim() === "child");
          					if (!verdictAtClose) { reject(new Error(JSON.stringify(snapshot))); return; }
          					resolve("ok");
          				}, delayMs);
          			});
          			child.on("error", () => reject(new Error('{"spawnError":true}')));
          		});
          	}
          `

          // TestZZZFlakeProbe repeats the spawn flow and reports every run whose
          // result differs at close time versus shortly after.
          func TestZZZFlakeProbe(t *testing.T) {
          	failedAtClose, total := 0, 0
          	for i := 0; i < 200; i++ {
          		rt, err := New(flakeScript, Options{NodeJS: true, AllowExec: true, BaseDir: t.TempDir(), Console: io.Discard, Timeout: 5 * time.Second})
          		if err != nil {
          			t.Fatalf("init: %v", err)
          		}
          		probeErr := rt.Call("verify", "printf child", 50)
          		rt.Close()
          		total++
          		if probeErr != nil {
          			failedAtClose++
          			if failedAtClose <= 5 {
          				fmt.Printf("FLAKE RUN %d: %v\n", i, probeErr)
          			}
          		}
          	}
          	fmt.Printf("FLAKE SUMMARY: %d/%d runs had verdictAtClose=false\n", failedAtClose, total)
          }
          EOF
          go test ./pkg/jsruntime/ -run TestZZZFlakeProbe -count=1 -v -timeout 10m 2>&1 | tail -25
