name: Komari Stable Release

# 发布流程：release published 时构建各平台二进制并上传 release 资产，
# 随后构建并推送多架构 Docker 镜像。
#   - 只发布不可变 tag: <release tag>（例如 v1.5.0-stable.5，永不覆盖）
#   - 不发布或移动 stable/latest 等浮动 tag；正式 Release 只用于后台更新提示，
#     运行中的面板必须由管理员显式升级。
# 与上游 release.yml 的区别：
#   1) 前端 ref 来自固定仓库 + 固定 ref（不解析 -fixN 后缀，不做默认分支回退）；
#   2) Go 版本显式固定；
#   3) 汇总生成 SHA256SUMS 并上传到 release；
#   4) 上传前按不可变规则校验（缺失才补、一致才跳过、不一致即失败）。
#   5) 构建前从受保护的 stable 读取 release preflight，拒绝非 stable 历史或
#      未通过全部必需检查的 tag commit。
#
# 不可变性的执行者（scripts/release-guard.sh）必须来自**被发布的那个 tag 自己**：
#   * release event -> checkout release tag；
#   * workflow_dispatch -> 显式输入 tag 并 checkout 该 tag；
# 绝不从 stable/default 分支取 guard —— 否则等于用今天的规则改写过去 Release 的不可变策略。
# 历史 tag 若不含 scripts/release-guard.sh：直接 FAIL CLOSED
# （this legacy release does not contain the immutable release guard; automatic repair is refused），
# 需要处理时人工评估或发布新的 stable.N。
#
# 不可变性规则（见 MAINTENANCE_POLICY.md §2.2）：
#   * 已发布的 release 资产永不覆盖：同名资产只有字节完全一致时才视为完成并跳过，
#     字节不同则立即 FAIL（immutable release asset mismatch），也不会删除旧资产绕过；
#   * 已发布的固定版本镜像 tag 永不指向新 digest：tag 已存在即 FAIL；
#   * workflow_dispatch 只能"补齐缺失资产"——它不具备覆盖重发的能力。
#     若已公开的产物确实有问题，请发布 v1.5.0-stable.2，而不是重写 stable.1。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag；手动执行只能补齐缺失资产（已发布资产仅在字节一致时跳过，绝不覆盖）"
        required: true
        type: string

permissions:
  contents: write
  checks: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 构建期资产（嵌入前端 + 随包主题）由 bundled-themes.lock.json 固定，见 scripts/prepare-assets.py。
  ASSETS_ARTIFACT: komari-assets
  GO_VERSION: "1.25.x"
  ZIG_VERSION: "0.14.1"
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release-preflight:
    name: Release provenance preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      # 安全边界：preflight 必须来自受保护的 stable，而不是待验证的 tag。
      # 否则任意临时分支都能在自己的 tag 中篡改校验程序后自我放行。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: stable
          fetch-depth: 0
      - name: Require stable ancestry and successful required checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/release-preflight.sh \
            "${{ github.repository }}" \
            "${RELEASE_TAG}" \
            stable \
            required-gate admin-sw-gate security-gate secret-gate

  prepare-assets:
    needs: release-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Require the release guard from this release
        run: |
          set -euo pipefail
          # 不可变策略随版本一起冻结：guard 必须来自本次 checkout 的那个 tag，
          # 而不是今天的分支。历史 tag 缺 guard 时明确拒绝自动补缺。
          if [ ! -f scripts/release-guard.sh ]; then
            echo "::error::this legacy release does not contain the immutable release guard; automatic repair is refused"
            exit 1
          fi

      - uses: ./.github/actions/prepare-assets
        with:
          artifact-name: komari-assets

  build-and-attach-binaries:
    needs: prepare-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            zig_target: x86_64-linux-musl
            ext: ""
          - goos: linux
            goarch: arm64
            zig_target: aarch64-linux-musl
            ext: ""
          - goos: windows
            goarch: amd64
            zig_target: x86_64-windows-gnu
            ext: ".exe"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Require the release guard from this release
        run: |
          set -euo pipefail
          # 不可变策略随版本一起冻结：guard 必须来自本次 checkout 的那个 tag，
          # 而不是今天的分支。历史 tag 缺 guard 时明确拒绝自动补缺。
          if [ ! -f scripts/release-guard.sh ]; then
            echo "::error::this legacy release does not contain the immutable release guard; automatic repair is refused"
            exit 1
          fi

      - uses: ./.github/actions/restore-assets
        with:
          artifact-name: komari-assets
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: ./.github/actions/setup-zig
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Resolve the version string (release tag without the v prefix)
        run: |
          # tag 用 v1.5.0-stable.0，二进制内显示的版本必须是 1.5.0-stable.0
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.zig_target }}
          GIN_MODE: release
        run: |
          set -euxo pipefail
          NAME="komari-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari/utils.VersionHash=${GITHUB_SHA}" \
            -o "$NAME" .
          ls -la "$NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: komari-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komari-${{ matrix.goos }}-${{ matrix.goarch }}*
      - name: "Upload binary to release (immutable - fill gaps only, never overwrite)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          NAME="komari-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          PLAN="${RUNNER_TEMP}/assets-to-upload.txt"
          # 已存在且字节一致 -> 计划里没有它，视为已完成；字节不同 -> guard 直接失败。
          bash scripts/release-guard.sh assets "${{ github.repository }}" "${RELEASE_TAG}" "$PLAN" "$NAME"
          if grep -qx "$NAME" "$PLAN"; then
            # 绝不使用 --clobber：只有目录里确实没有这个资产时才上传。
            gh release upload "${RELEASE_TAG}" "$NAME" --repo "${{ github.repository }}"
          else
            echo "SKIP: ${NAME} is already published with identical bytes"
          fi

  checksums:
    needs: build-and-attach-binaries
    # 二进制作业在上传阶段失败（例如重跑时守卫拒绝覆盖）也要能把 SHA256SUMS 补齐：
    # 只要三个产物凑齐（本次构建 或 已发布），本作业仍然完成它的职责。
    if: ${{ always() && needs['build-and-attach-binaries'].result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      # 需要仓库内容：上传前用 scripts/release-guard.sh 校验（保持不可变语义）。
      # checkout 被发布的 tag（而不是触发本次运行的 ref）：补缺重跑同样使用该 tag 自己的
      # guard，于是未来 stable 分支的改动永远无法改变过去 Release 的不可变规则。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Require the release guard from this release
        run: |
          set -euo pipefail
          # 不可变策略随版本一起冻结：guard 必须来自本次 checkout 的那个 tag，
          # 而不是今天的分支。历史 tag 缺 guard 时明确拒绝自动补缺。
          if [ ! -f scripts/release-guard.sh ]; then
            echo "::error::this legacy release does not contain the immutable release guard; automatic repair is refused"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: komari-*
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          cd dist
          rm -f SHA256SUMS
          # 已发布的资产是唯一事实来源：重跑时用"实际发布出去"的那一份，首次运行时用本次构建产物。
          # 重建并不逐字节可复现，所以绝不能拿重建结果去描述已发布的二进制。
          EXPECTED="komari-linux-amd64 komari-linux-arm64 komari-windows-amd64.exe"
          for name in ${EXPECTED}; do
            if gh release download "${RELEASE_TAG}" --repo "${{ github.repository }}" \
                 --pattern "$name" --dir "${RUNNER_TEMP}/published" >/dev/null 2>&1; then
              mv "${RUNNER_TEMP}/published/$name" "$name"
              echo "SHA256SUMS: using the published ${name}"
            elif [ -f "$name" ]; then
              echo "SHA256SUMS: using the locally built ${name}"
            else
              echo "FAIL: neither a published asset nor a built artifact for ${name}"
              exit 1
            fi
          done
          sha256sum ${EXPECTED} > SHA256SUMS
          cat SHA256SUMS
      - name: "Upload SHA256SUMS to release (immutable - fill gaps only, never overwrite)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          PLAN="${RUNNER_TEMP}/assets-to-upload.txt"
          # 先确认它描述的正是已发布的资产集合，再套用不可变规则。
          bash scripts/release-guard.sh verify-sums "${{ github.repository }}" "${RELEASE_TAG}" dist/SHA256SUMS
          bash scripts/release-guard.sh assets "${{ github.repository }}" "${RELEASE_TAG}" "$PLAN" dist/SHA256SUMS
          if grep -qx "SHA256SUMS" "$PLAN"; then
            gh release upload "${RELEASE_TAG}" dist/SHA256SUMS --repo "${{ github.repository }}"
          else
            echo "SKIP: SHA256SUMS is already published with identical bytes"
          fi

  build-and-push-docker:
    needs: build-and-attach-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Require the release guard from this release
        run: |
          set -euo pipefail
          # 不可变策略随版本一起冻结：guard 必须来自本次 checkout 的那个 tag，
          # 而不是今天的分支。历史 tag 缺 guard 时明确拒绝自动补缺。
          if [ ! -f scripts/release-guard.sh ]; then
            echo "::error::this legacy release does not contain the immutable release guard; automatic repair is refused"
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: komari-linux-*
          path: .
          merge-multiple: true
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published version tag
        run: |
          set -euxo pipefail
          # 固定版本 tag 一经成功发布即不可覆盖：已存在 -> FAIL。
          # stable.4 是已经冻结的已知公开镜像，仅用于区分 registry 不可达与新 tag 不存在；
          # 本工作流不会移动或重新发布它。
          bash scripts/release-guard.sh image \
            "${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}" \
            "${REGISTRY}/${IMAGE_NAME}:v1.5.0-stable.4"
      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
