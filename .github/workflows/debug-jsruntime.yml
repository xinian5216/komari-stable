name: Debug jsruntime on Linux (temporary)

# 临时诊断工作流：仅用于定位 pkg/jsruntime 在 Linux 上的测试失败根因。
# 只读、无 secrets、不发布任何东西。定位完成后会在后续提交中删除。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Repeat the child_process tests on Linux
        run: |
          set -uxo pipefail
          echo "########## child_process 全系列 x20 ##########"
          go test ./pkg/jsruntime/ -run 'TestChildProcess|TestNodeChildProcessHelper|TestNodeFileCreationMode' -count=20 -timeout 10m > /tmp/child.log 2>&1
          echo "exit=$?"
          grep -c -- "--- FAIL" /tmp/child.log || true
          tail -5 /tmp/child.log
          echo "########## 整个 jsruntime 包 x3 ##########"
          go test ./pkg/jsruntime/ -count=3 -timeout 15m > /tmp/pkg.log 2>&1
          echo "exit=$?"
          grep -c -- "--- FAIL" /tmp/pkg.log || true
          tail -5 /tmp/pkg.log
