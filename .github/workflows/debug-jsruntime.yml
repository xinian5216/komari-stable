name: Debug jsruntime on Linux (temporary)

# 临时诊断工作流：仅用于定位 pkg/jsruntime 在 Linux 上的测试失败根因。
# 只读、无 secrets、不发布任何东西。定位完成后会在后续提交中删除。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Mirror the real test verbatim, with a diagnostic on failure
        run: |
          set -euxo pipefail
          cp pkg/jsruntime/node_test.go pkg/jsruntime/zzz_mirror_test.go
          python - <<'PY'
          import io, re
          p = "pkg/jsruntime/zzz_mirror_test.go"
          s = io.open(p, encoding="utf-8").read()

          assert "func TestChildProcessPermissionAndExecution(" in s
          s = s.replace("func TestChildProcessPermissionAndExecution(", "func TestZZZMirrorExact(", 1)

          old_close = 'child.on("close", (code) => resolve(code === 0 && syncOutput === "child" && output.trim() === "child"));'
          assert old_close in s, "close handler not found"
          new_close = ('child.on("close", (code) => {'
                       ' const verdict = (code === 0 && syncOutput === "child" && output.trim() === "child");'
                       ' if (verdict) { resolve(true); return; }'
                       ' reject(new Error(JSON.stringify({exitCode: code, exitType: typeof code,'
                       ' syncOutput: String(syncOutput), syncOutputType: typeof syncOutput,'
                       ' output: String(output), outputType: typeof output, pid: child.pid}))); });')
          s = s.replace(old_close, new_close, 1)

          old_error = 'child.on("error", () => resolve(false));'
          assert old_error in s, "error handler not found"
          new_error = ('child.on("error", (e) => reject(new Error("child error event: " + String(e)'
                       ' + " pid=" + child.pid + " used=" + (child.exitCode) + "/" + (child.signalCode))));')
          s = s.replace(old_error, new_error, 1)

          io.open(p, "w", encoding="utf-8").write(s)
          print("mirror patched")
          PY
          gofmt -l pkg/jsruntime/zzz_mirror_test.go || true

          echo "########## 200 次重复，打印失败现场 ##########"
          go test ./pkg/jsruntime/ -run 'TestZZZMirrorExact' -count=200 -v 2>&1 \
            | grep -E "error event|exitCode|Traceback|node_test.go|zzz_mirror_test.go|^(--- |ok|FAIL|PASS)" | head -40

      - name: Same mirror, single run, for comparison
        run: |
          go test ./pkg/jsruntime/ -run 'TestZZZMirrorExact' -count=1 -v 2>&1 | tail -6
