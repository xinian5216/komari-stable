name: Komari Stable CI

# 稳定分支的持续集成：测试 / 静态检查 / 漏洞扫描 / 构建。
# 与上游 build.yml 的区别：
#   1) 上游 CI 从不运行 go test —— 这里把测试作为必过项；
#   2) 前端 ref 固定（不跟随会漂移的默认分支）；
#   3) Go 版本显式固定（上游写死 1.23，与 go.mod 的 1.25 不一致）；
#   4) 新增 go vet 与 govulncheck。

on:
  pull_request:
  push:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 构建期资产（嵌入用前端 + 随包主题）统一由 bundled-themes.lock.json 固定：
  # 仓库、tag、commit、asset、sha256 只有一份事实来源，见 scripts/prepare-assets.py。
  ASSETS_ARTIFACT: komari-assets
  GO_VERSION: "1.25.x"
  GOVULNCHECK_VERSION: "v1.1.4"
  ZIG_VERSION: "0.14.1"

jobs:
  # 这些高价值 E2E 原先只能手动运行或在合并后按路径触发，无法在 PR 合并前阻断。
  # 作为本工作流的可复用 job 调用后，它们与当前提交绑定，并统一汇总进 required-gate。
  anonymous-e2e:
    uses: ./.github/workflows/anonymous-e2e.yml
    with:
      server_repo: xinian5216/komari-stable
      agent_repo: xinian5216/komari-agent-stable
      branch: ${{ github.sha }}
      agent_branch: stable

  migration-e2e:
    uses: ./.github/workflows/migration-test.yml

  bundled-theme-e2e:
    uses: ./.github/workflows/bundled-theme-test.yml

  # 轻量校验：.agent/ 索引文件齐全、PROJECT_MAP 提到的路径存在（不做语义检查，避免误报）
  agent-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check .agent index consistency
        run: python scripts/check_agent_index.py
      - name: Guard removed remote-control surface
        run: python scripts/check_remote_control_removed.py

  # 所有需要编译 Go 代码的 job 都依赖构建期资产：
  # //go:embed defaultTheme/dist.tar.zst（嵌入前端）与 //go:embed bundledTheme（随包主题）。
  # prepare-assets 是唯一入口：按锁文件准备并校验，之后才能跑 go test/vet/build/govulncheck。
  prepare-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-assets
        with:
          artifact-name: ${{ env.ASSETS_ARTIFACT }}

  test:
    needs: prepare-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/restore-assets
        with:
          artifact-name: ${{ env.ASSETS_ARTIFACT }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1
      # 发布不可变守卫的自测（无网络：gh / docker 均被桩替换）
      - name: Release guard self-test
        run: bash scripts/tests/test-release-guard.sh
      # 发布来源守卫的正反向自测（本地 Git 历史 + gh 桩，无网络）
      - name: Release preflight self-test
        run: bash scripts/tests/test-release-preflight.sh
      - name: Installer migration safety self-test
        run: bash scripts/tests/test-installer-migration.sh
      # 测试必须自清理：运行期数据（主题、数据库等）不得落进源码树。
      # 构建期资产与已知的包内 data 目录由 .gitignore 覆盖，因此这里要求 git 完全干净；
      # 空目录不会被 git 看见，所以再单独检查主题运行期文件。
      - name: Fail if the test run polluted the worktree
        run: |
          set -euxo pipefail
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          if [ -n "$status" ]; then
            echo "FAIL: go test left tracked-visible changes in the source tree"
            git status --porcelain
            exit 1
          fi
          leftovers="$(find . -path '*/data/theme/*' -type f -not -path './.git/*' | head -20)"
          if [ -n "$leftovers" ]; then
            echo "FAIL: go test wrote theme runtime files into the source tree:"
            printf '%s\n' "$leftovers"
            exit 1
          fi
          echo "OK: worktree clean and no theme runtime files were created"

  vuln:
    needs: prepare-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/restore-assets
        with:
          artifact-name: ${{ env.ASSETS_ARTIFACT }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...
          # 说明：出现"代码可达"漏洞时该步骤失败——这正是希望被看到的结果；
          # 修复以独立的 security:/build: 提交进入，不在本 job 内自动升级依赖。

  build:
    needs: prepare-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            zig_target: x86_64-linux-musl
            ext: ""
          - goos: linux
            goarch: arm64
            zig_target: aarch64-linux-musl
            ext: ""
          - goos: windows
            goarch: amd64
            zig_target: x86_64-windows-gnu
            ext: ".exe"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/restore-assets
        with:
          artifact-name: ${{ env.ASSETS_ARTIFACT }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: ./.github/actions/setup-zig
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.zig_target }}
          GIN_MODE: release
        run: |
          set -euxo pipefail
          NAME="komari-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=${GITHUB_REF_NAME} -X github.com/komari-monitor/komari/utils.VersionHash=${GITHUB_SHA}" \
            -o "$NAME" .
          sha256sum "$NAME" > "$NAME.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: komari-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            komari-${{ matrix.goos }}-${{ matrix.goarch }}*

  required-gate:
    name: required-gate
    if: ${{ always() }}
    needs:
      [anonymous-e2e, migration-e2e, bundled-theme-e2e, agent-index, prepare-assets, test, vuln, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every stable CI gate
        run: |
          test "${{ needs.agent-index.result }}" = success
          test "${{ needs.anonymous-e2e.result }}" = success
          test "${{ needs.migration-e2e.result }}" = success
          test "${{ needs.bundled-theme-e2e.result }}" = success
          test "${{ needs.prepare-assets.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.vuln.result }}" = success
          test "${{ needs.build.result }}" = success
