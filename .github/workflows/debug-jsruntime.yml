name: Debug jsruntime on Linux (temporary)

# 临时诊断工作流：仅用于验证 pkg/jsruntime 在 Linux 上的修复稳定性。
# 只读、无 secrets、不发布任何东西。验证完成后会在后续提交中删除。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Repeat the child_process tests 100 times on Linux
        run: |
          set -uxo pipefail
          echo "########## child_process 全系列 x100 ##########"
          go test ./pkg/jsruntime/ -run 'TestChildProcess|TestNodeChildProcessHelper|TestNodeFileCreationMode' -count=100 -timeout 20m > /tmp/child100.log 2>&1
          echo "exit=$?"
          echo -n "FAIL 次数: "; grep -c -- "--- FAIL" /tmp/child100.log || true
          tail -3 /tmp/child100.log

      - name: Whole package five times
        run: |
          set -uxo pipefail
          go test ./pkg/jsruntime/ -count=5 -timeout 20m > /tmp/pkg5.log 2>&1
          echo "exit=$?"
          echo -n "FAIL 次数: "; grep -c -- "--- FAIL" /tmp/pkg5.log || true
          tail -3 /tmp/pkg5.log
