name: Security Scan

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.x"
  GOVULNCHECK_VERSION: "v1.1.4"

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-assets
        with:
          artifact-name: security-assets-govulncheck

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      # govulncheck v1.1.4 SARIF can contain duplicate tags that GitHub rejects.
      # Keep a machine-readable JSON artifact and use the text run as the hard gate.
      - name: Generate machine-readable report
        run: govulncheck -json ./... > govulncheck.json

      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: govulncheck-${{ github.sha }}
          path: govulncheck.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail on reachable vulnerabilities
        run: govulncheck ./...

  codeql:
    name: CodeQL (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go must be installed before CodeQL init so its tracing wrapper targets
      # the same toolchain that performs the manual build.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: go
          build-mode: manual

      - uses: ./.github/actions/prepare-assets
        with:
          artifact-name: security-assets-codeql

      - name: Build for CodeQL
        run: go build ./...

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:go

  security-gate:
    name: security-gate
    if: ${{ always() }}
    needs: [govulncheck, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Require vulnerability and CodeQL scans
        run: |
          test "${{ needs.govulncheck.result }}" = success
          test "${{ needs.codeql.result }}" = success
