name: Secret Scan

# 每次 push / PR 都扫描完整 Git 历史（不只 HEAD），发现高置信度 secret 时让 CI 失败。
# 使用固定版本的 gitleaks CLI（与本地、发布审计用同一版本），不依赖第三方 Action 的许可证/环境。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 必须：全历史扫描

      - name: Install gitleaks (pinned)
        run: |
          set -euxo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full history (all refs)
        run: |
          set -euxo pipefail
          # --redact: 不在日志里打印命中的明文；--exit-code 1: 命中即失败
          gitleaks git . --log-opts="--all" --config .gitleaks.toml --redact --exit-code 1 -v

      - name: Scan working tree (published content)
        run: |
          set -euxo pipefail
          gitleaks dir . --config .gitleaks.toml --redact --exit-code 1 -v

  secret-gate:
    name: secret-gate
    if: ${{ always() }}
    needs: [gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Require the full-history secret scan
        run: test "${{ needs.gitleaks.result }}" = success
