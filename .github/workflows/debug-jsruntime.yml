name: Debug jsruntime on Linux (temporary)

# 临时诊断工作流：仅用于定位 pkg/jsruntime 在 Linux 上的测试失败根因。
# 只读、无 secrets、不发布任何东西。定位完成后会在后续提交中删除。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: child_process probe (throw the report so Call surfaces it)
        run: |
          set -euxo pipefail
          cat > pkg/jsruntime/zz_debug_child_test.go <<'EOF'
          package jsruntime

          import (
          	"fmt"
          	"io"
          	"testing"
          	"time"
          )

          func TestZZDebugChildProbe(t *testing.T) {
          	rt, err := New(`
          		function verify(command) {
          			const childProcess = require("child_process");
          			const report = { command: command };
          			try {
          				const raw = childProcess.execSync(command, { encoding: "utf8" });
          				report.execSyncRaw = JSON.stringify(raw);
          				report.execSyncTrimmed = JSON.stringify(raw === null || raw === undefined ? null : String(raw).trim());
          			} catch (e) {
          				report.execSyncError = String(e);
          			}
          			return new Promise((resolve) => {
          				try {
          					const child = childProcess.spawn(command, [], { shell: true, encoding: "utf8" });
          					report.pid = child.pid;
          					report.hasStdout = !!child.stdout;
          					if (!child.stdout) { throw new Error("child.stdout is null"); }
          					let output = "";
          					child.stdout.on("data", (chunk) => { output += String(chunk); });
          					child.on("close", (code) => {
          						report.exitCode = code;
          						report.outputRaw = JSON.stringify(output);
          						report.outputTrimmed = JSON.stringify(output.trim());
          						resolve();
          					});
          					child.on("error", (e) => { report.spawnError = String(e); resolve(); });
          				} catch (e) {
          					report.thrown = String(e);
          					resolve();
          				}
          			}).then(() => { throw new Error(JSON.stringify(report)); });
          		}
          	`, Options{NodeJS: true, AllowExec: true, BaseDir: t.TempDir(), Console: io.Discard, Timeout: 10 * time.Second})
          	if err != nil {
          		t.Fatalf("runtime init: %v", err)
          	}
          	defer rt.Close()
          	if err := rt.Call("verify", "printf child"); err != nil {
          		fmt.Printf("CHILD PROBE REPORT: %v\n", err)
          	}
          }
          EOF
          go test ./pkg/jsruntime/ -run TestZZDebugChildProbe -v -count=1 2>&1 | tail -20

      - name: shell behaviour on this runner (for comparison)
        run: |
          set -x
          /bin/sh -c "printf child"; echo " <- /bin/sh printf (no newline)"
          /bin/sh -c "printf child" | od -c | head -2
          command -v printf; type printf 2>&1 | head -2
