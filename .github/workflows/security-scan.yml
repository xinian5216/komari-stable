name: Security Scan

on:
  push:
    branches: [stable]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/actions/**"
      - ".github/workflows/security-scan.yml"
  pull_request:
    branches: [stable]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/actions/**"
      - ".github/workflows/security-scan.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.x"
  GOVULNCHECK_VERSION: "v1.1.4"

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare-assets
        with:
          artifact-name: security-assets-govulncheck

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      # govulncheck v1.1.4 SARIF can contain duplicate tags that GitHub rejects.
      # Keep a machine-readable JSON artifact and use the text run as the hard gate.
      - name: Generate machine-readable report
        run: govulncheck -json ./... > govulncheck.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-${{ github.sha }}
          path: govulncheck.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail on reachable vulnerabilities
        run: govulncheck ./...

  codeql:
    name: CodeQL (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Go must be installed before CodeQL init so its tracing wrapper targets
      # the same toolchain that performs the manual build.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual

      - uses: ./.github/actions/prepare-assets
        with:
          artifact-name: security-assets-codeql

      - name: Build for CodeQL
        run: go build ./...

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
