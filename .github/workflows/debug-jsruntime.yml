name: Debug jsruntime on Linux (temporary)

# 临时诊断工作流：仅用于定位 pkg/jsruntime 在 Linux 上的测试失败根因。
# 只读、无 secrets、不发布任何东西。定位完成后会在后续提交中删除。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Full package run with early and late probes
        run: |
          set -euxo pipefail

          # 探针内容：与失败测试等价的 child_process 流程，但抛出完整报告。
          probe() {
            cat > "pkg/jsruntime/$1_test.go" <<EOF
          package jsruntime

          import (
          	"io"
          	"fmt"
          	"testing"
          	"time"
          )

          func $2(t *testing.T) {
          	rt, err := New(\`
          		function verify(command) {
          			const childProcess = require("child_process");
          			const report = { command: command, cwd: process.cwd() };
          			let syncOutput = null;
          			try {
          				syncOutput = childProcess.execSync(command, { encoding: "utf8" }).trim();
          			} catch (e) { report.execSyncError = String(e); }
          			return new Promise((resolve) => {
          				try {
          					const child = childProcess.spawn(command, [], { shell: true, encoding: "utf8" });
          					report.pid = child.pid;
          					report.hasStdout = !!child.stdout;
          					if (!child.stdout) { throw new Error("child.stdout is null"); }
          					let output = "";
          					child.stdout.on("data", (chunk) => { output += String(chunk); });
          					child.on("close", (code) => {
          						report.exitCode = code;
          						report.syncOutput = JSON.stringify(syncOutput);
          						report.output = JSON.stringify(output);
          						report.verdict = (code === 0 && syncOutput === "child" && output.trim() === "child");
          						resolve();
          					});
          					child.on("error", (e) => { report.spawnError = String(e); resolve(); });
          				} catch (e) { report.thrown = String(e); resolve(); }
          			}).then(() => { throw new Error(JSON.stringify(report)); });
          		}
          	\`, Options{NodeJS: true, AllowExec: true, BaseDir: t.TempDir(), Console: io.Discard, Timeout: 5 * time.Second})
          	if err != nil {
          		t.Fatalf("init: %v", err)
          	}
          	defer rt.Close()
          	if err := rt.Call("verify", "printf child"); err != nil {
          		fmt.Printf("PROBE[$2]: %v\n", err)
          	} else {
          		fmt.Printf("PROBE[$2]: resolved truthy (no report)\n")
          	}
          }
          EOF
          }

          probe aaa_early_probe TestAAAChildProbeEarly
          probe zzz_late_probe TestZZZChildProbeLate

          echo "########## 全包运行（顺序：aaa 探针最先，node_test.go 的测试居中，zzz 探针最后）##########"
          go test ./pkg/jsruntime/ -count=1 -v 2>&1 | grep -E "^(=== RUN|--- PASS|--- FAIL|    )|PROBE\[" | grep -E "ChildProcess|PROBE\[|node_test|--- FAIL|^ok|^FAIL" | head -40
