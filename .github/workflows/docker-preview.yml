name: Docker Preview Build (no push)

# 预演入口：只构建、不推送、不创建 Release、不覆盖任何正式 tag。
# 用途：在不发布正式版本的前提下验证
#   1) 固定前端 ref（komari-web-stable@v1.5.0-stable.0）能被嵌入；
#   2) linux/amd64 与 linux/arm64 二进制可交叉编译；
#   3) Dockerfile 在两个架构上都能构建成功。
# 正式发布仍由 stable-release.yml（release published）负责。

# (comment touch: re-index the workflow on the default branch)
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 构建期资产（嵌入前端 + 随包主题）由 bundled-themes.lock.json 固定，见 scripts/prepare-assets.py。
  ASSETS_ARTIFACT: komari-assets
  GO_VERSION: "1.25.x"
  ZIG_VERSION: "0.14.1"

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare-assets
        with:
          artifact-name: komari-assets

  build-docker-binaries:
    needs: prepare-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            zig_target: x86_64-linux-musl
          - goarch: arm64
            zig_target: aarch64-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/restore-assets
        with:
          artifact-name: komari-assets
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: ./.github/actions/setup-zig
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Build linux binary (preview)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.zig_target }}
          GIN_MODE: release
        run: |
          set -euxo pipefail
          NAME="komari-linux-${{ matrix.goarch }}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=preview -X github.com/komari-monitor/komari/utils.VersionHash=${GITHUB_SHA}" \
            -o "$NAME" .
          ls -la "$NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: komari-linux-${{ matrix.goarch }}
          path: komari-linux-${{ matrix.goarch }}

  docker-preview:
    needs: build-docker-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: komari-linux-*
          path: .
          merge-multiple: true
      - name: Show binaries for the image build
        run: ls -la komari-linux-*
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build amd64 image for a runtime check (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: komari-stable:preview-amd64
      - name: Build multi-arch image (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: komari-stable:preview-${{ github.sha }}

      # Docker 部署方式下的行为门禁：全新安装应默认使用随包内嵌的 Komari Next，
      # 且管理后台仍由嵌入式核心前端提供。数据目录挂在具名 volume 上。
      - name: First-run Docker smoke (fresh install -> bundled theme)
        run: |
          set -euxo pipefail
          PORT=25880
          docker volume create komari-preview-data >/dev/null
          # 必须显式给出二进制路径：镜像的 CMD 是 ["/app/komari","server"]，追加参数会整体替换 CMD。
          docker run -d --name komari-preview -p ${PORT}:${PORT} -v komari-preview-data:/app/data \
            komari-stable:preview-amd64 /app/komari server -l 0.0.0.0:${PORT} >/dev/null
          trap 'docker logs komari-preview | tail -40 || true; docker rm -f komari-preview >/dev/null 2>&1 || true; docker volume rm komari-preview-data >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 45); do curl -sf "http://127.0.0.1:${PORT}/api/install/status" >/dev/null && break; sleep 2; done
          curl -s -o /dev/null -w 'install http=%{http_code}\n' -X POST "http://127.0.0.1:${PORT}/api/install/complete" \
            -H 'Content-Type: application/json' \
            -d '{"username":"dockeradmin","password":"DockerAdmin#2026","sitename":"Docker Smoke","description":"","metric_dsn":"./data/metrics.db"}'
          for i in $(seq 1 45); do curl -sf "http://127.0.0.1:${PORT}/api/version" >/dev/null && break; sleep 2; done
          sleep 2

          echo "--- theme setting and seeded files (inside the container) ---"
          docker exec komari-preview sh -lc 'ls -la /app/data/theme/next/komari-theme.json /app/data/theme/next/dist/index.html'
          docker exec komari-preview sh -lc 'cat /app/data/theme/next/komari-theme.json' | python3 -c "import json,sys;m=json.load(sys.stdin);print('manifest:',m['short'],m['version'],m['author'],m['url']);assert m['short']=='next';assert 'xinian5216/komari-next-stable' in m['url']"

          curl -sf "http://127.0.0.1:${PORT}/" -o /tmp/docker-index.html -w 'GET / -> %{http_code}\n'
          grep -qE "__next|_next/" /tmp/docker-index.html || { echo "FAIL: / must be served by the bundled theme"; exit 1; }
          if grep -q "entry-index-" /tmp/docker-index.html; then echo "FAIL: / served the embedded default"; exit 1; fi
          curl -sf "http://127.0.0.1:${PORT}/admin" -o /tmp/docker-admin.html -w 'GET /admin -> %{http_code}\n'
          grep -q "entry-index-" /tmp/docker-admin.html || { echo "FAIL: /admin must stay on the embedded default"; exit 1; }
          if grep -qE "__next|_next/" /tmp/docker-admin.html; then echo "FAIL: /admin leaked the theme"; exit 1; fi
          curl -sf -o /dev/null -w 'GET /favicon.ico -> %{http_code}\n' "http://127.0.0.1:${PORT}/favicon.ico"
          echo "OK: Docker first-run uses the bundled Komari Next theme"

          echo "--- restart must not touch the theme ---"
          docker restart komari-preview >/dev/null
          for i in $(seq 1 45); do curl -sf "http://127.0.0.1:${PORT}/api/version" >/dev/null && break; sleep 2; done
          curl -sf "http://127.0.0.1:${PORT}/" -o /tmp/docker-index2.html -w 'GET / after restart -> %{http_code}\n'
          cmp -s /tmp/docker-index.html /tmp/docker-index2.html && echo "OK: theme unchanged after restart"

  # linux/arm64 只做"运行态最小冒烟"：QEMU 下能起容器、能完成安装向导、
  # 随包主题确实落在 data/theme/next 且被采用。RPC / WebSocket / 私有站点已在 amd64 E2E 覆盖，这里不重复。
  # 若任务在 "Set up QEMU" 这一步失败，那是基础设施问题（binfmt/QEMU 不可用），与产品无关。
  docker-arm64-smoke:
    needs: build-docker-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: komari-linux-arm64
          path: .
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build linux/arm64 image (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/arm64
          tags: komari-stable:preview-arm64
      - name: "arm64 minimal smoke: install wizard -> bundled theme"
        run: |
          set -euxo pipefail
          PORT=25881
          docker volume create komari-arm64-data >/dev/null
          docker run -d --name komari-arm64 --platform linux/arm64 -p ${PORT}:${PORT} \
            -v komari-arm64-data:/app/data komari-stable:preview-arm64 \
            /app/komari server -l 0.0.0.0:${PORT} >/dev/null
          trap 'docker logs komari-arm64 | tail -30 || true; docker rm -f komari-arm64 >/dev/null 2>&1 || true; docker volume rm komari-arm64-data >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do curl -sf "http://127.0.0.1:${PORT}/api/install/status" >/dev/null && break; sleep 2; done
          curl -s -o /dev/null -w 'install http=%{http_code}\n' -X POST "http://127.0.0.1:${PORT}/api/install/complete" \
            -H 'Content-Type: application/json' \
            -d '{"username":"arm64admin","password":"Arm64Admin#2026","sitename":"arm64 Smoke","description":"","metric_dsn":"./data/metrics.db"}'
          for i in $(seq 1 60); do curl -sf "http://127.0.0.1:${PORT}/api/version" >/dev/null && break; sleep 2; done
          sleep 2

          echo "--- data/theme/next/komari-theme.json ---"
          docker exec komari-arm64 sh -lc 'cat /app/data/theme/next/komari-theme.json' | python3 -c "import json,sys;m=json.load(sys.stdin);print('manifest:',m['short'],m['version'],m['author'],m['url']);assert m['short']=='next';assert 'xinian5216/komari-next-stable' in m['url']"

          echo "--- theme setting read back through the admin API ---"
          curl -s -X POST "http://127.0.0.1:${PORT}/api/login" -H 'Content-Type: application/json' \
            -d '{"username":"arm64admin","password":"Arm64Admin#2026"}' -o /tmp/arm64-login.json -w 'login http=%{http_code}\n'
          TOKEN=$(python3 -c "import json;print(json.load(open('/tmp/arm64-login.json'))['data']['set-cookie']['session_token'])")
          curl -s -X POST "http://127.0.0.1:${PORT}/api/rpc2" -H 'Content-Type: application/json' -H "Cookie: session_token=${TOKEN}" \
            -d '{"jsonrpc":"2.0","id":1,"method":"admin:getSettings","params":{}}' -o /tmp/arm64-settings.json
          python3 -c "import json;s=json.load(open('/tmp/arm64-settings.json'))['result'];print('theme =',s.get('theme'));assert s.get('theme')=='next'"

          curl -sf "http://127.0.0.1:${PORT}/" -o /tmp/arm64-index.html -w 'GET / -> %{http_code}\n'
          grep -qE "__next|_next/" /tmp/arm64-index.html || { echo "FAIL: / must be served by the bundled theme"; exit 1; }
          if grep -q "entry-index-" /tmp/arm64-index.html; then echo "FAIL: / served the embedded default"; exit 1; fi
          curl -sf "http://127.0.0.1:${PORT}/admin" -o /tmp/arm64-admin.html -w 'GET /admin -> %{http_code}\n'
          grep -q "entry-index-" /tmp/arm64-admin.html || { echo "FAIL: /admin must stay on the embedded default"; exit 1; }
          echo "OK: arm64 container serves the bundled Komari Next theme"
